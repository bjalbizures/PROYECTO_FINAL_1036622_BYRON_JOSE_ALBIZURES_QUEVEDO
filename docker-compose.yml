services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto_1036622_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_PORT}:80"
      - "${FRONTEND_HTTPS_PORT}:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    networks:
      proyecto_net:
        aliases:
          - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_1036622_backend
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
    ports:
      - "${BACKEND_PORT}:5000"
    networks:
      proyecto_net:
        aliases:
          - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: proyecto_1036622_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      proyecto_net:
        aliases:
          - mongo
    restart: unless-stopped

networks:
  proyecto_net:
    driver: bridge

volumes:
  mongo_data:
