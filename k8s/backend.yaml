apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: proyecto-1036622
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: proyecto-final-1036622
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: proyecto-1036622
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: proyecto-final-1036622
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: proyecto-final-1036622
    spec:
      containers:
        - name: backend
          image: proyecto-1036622-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: proyecto-config
                  key: mongo-db
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-auth
                  key: uri
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
