apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: proyecto-1036622
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: proyecto-final-1036622
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: proyecto-1036622
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: proyecto-final-1036622
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: proyecto-final-1036622
    spec:
      containers:
        - name: frontend
          image: proyecto-1036622-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: frontend-tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: frontend-tls
          secret:
            secretName: frontend-tls
            items:
              - key: tls.crt
                path: localhost.crt
              - key: tls.key
                path: localhost.key
